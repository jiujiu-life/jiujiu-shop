imation-delay:'+(startDelay*0.08)+'s" onclick="openP(\''+p.id+'\')">' +'<div class="p-card-img">'+imgHTML+'</div>' +'<div class="p-card-info">' +'<span class="p-card-cat">'+esc(p.category)+'</span>'+(p.source?'<span class="p-card-src" data-src="'+esc(p.source)+'"></span>':'') +'<div class="p-card-name">'+nameHTML+'</div>' +'<div class="p-card-price">'+esc(p.price)+'</div></div></div>'; }function buildSectionHTML(cat,products,startDelay){ var shuffled=shuffle(products); var showCount=Math.min(8,shuffled.length); var shown=shuffled.slice(0,showCount); var remaining=shuffled.slice(showCount); var cards=shown.map(function(p,i){return buildCard(p,startDelay+i)}).join(''); var moreHTML=''; if(remaining.length>0){ moreHTML='<div class="btn-more-wrap" id="more-'+esc(cat)+'" data-remain-ids="'+esc(JSON.stringify(remaining.map(function(p){return p.id})))+'"><button class="btn-more" onclick="showMore(\''+esc(cat)+'\')">查看更多（还剩 '+remaining.length+' 件）</button></div>'; }else if(products.length>8){ moreHTML='<div class="btn-more-wrap"><button class="btn-more all-shown" disabled>已展示全部 '+products.length+' 件商品</button></div>'; } return '<section class="cat-section" data-cat="'+esc(cat)+'">' +'<div class="cat-section-head"><h3>'+esc(cat)+'</h3><p>'+esc(CAT_DESC[cat]||'')+'</p></div>' +'<div class="cat-grid-bg"><div class="cat-grid" id="grid-'+esc(cat)+'">'+cards+'</div>'+moreHTML+'</div>' +'</section>'; }function showMore(cat){ var wrap=document.getElementById('more-'+cat); if(!wrap)return; var ids=JSON.parse(wrap.getAttribute('data-remain-ids')); var all=Store.getProducts(); var idMap={}; for(var k=0;k<all.length;k++){idMap[all[k].id]=all[k]} var grid=document.getElementById('grid-'+cat); var existing=grid.querySelectorAll('.p-card').length; var nextIds=ids.splice(0,8); wrap.setAttribute('data-remain-ids',JSON.stringify(ids)); nextIds.forEach(function(pid,i){ var p=idMap[pid];if(!p)return; var div=document.createElement('div'); div.innerHTML=buildCard(p,existing+i); grid.appendChild(div.firstElementChild); }); if(ids.length>0){ wrap.querySelector('button').textContent='查看更多（还剩 '+ids.length+' 件）'; }else{ wrap.innerHTML='<button class="btn-more all-shown" disabled>已展示全部</button>'; } }function openP(id){ var ps=Store.getProducts(); for(var i=0;i<ps.length;i++){if(ps[i].id===id){curProduct=ps[i];break}} if(!curProduct)return; curImgIdx=0; document.getElementById('dCat').textContent=curProduct.category; document.getElementById('dName').textContent=curProduct.name; document.getElementById('dPrice').textContent=curProduct.price; document.getElementById('dDesc').textContent=(curProduct.description||'精选好物，认真了解自己，也认真爱自己。'); var stockEl=document.getElementById('dStock'); if(curProduct.stock>0){ stockEl.innerHTML='<span class="in-stock">有货</span> | 库存 '+curProduct.stock+' 件'; }else{ stockEl.innerHTML='暂时缺货'; } renderGallery(); document.getElementById('pModal').classList.add('active'); document.body.style.overflow='hidden'; } function renderGallery(){ var main=document.getElementById('gMain'); var thumbs=document.getElementById('gThumbs'); if(!curProduct.images||curProduct.images.length===0){ main.innerHTML='<div class="gallery-nav"><button onclick="changeImg(-1)" id="prevBtn" class="hidden">&#8249;</button><button onclick="changeImg(1)" id="nextBtn" class="hidden">&#8250;</button></div><div class="ph" style="background:'+grad(curProduct.category)+';width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Noto Serif SC,STSong,SimSun,serif;font-size:26px;color:rgba(255,255,255,.85);font-weight:500">'+esc(curProduct.name)+'</div>'; thumbs.innerHTML=''; return; } var imgs=curProduct.images; main.innerHTML='<div class="gallery-nav"><button onclick="changeImg(-1)" id="prevBtn" '+(curImgIdx===0?'class="hidden"':'')+'>&#8249;</button><button onclick="changeImg(1)" id="nextBtn" '+(curImgIdx===imgs.length-1?'class="hidden"':'')+'>&#8250;</button></div><img src="'+esc(imgs[curImgIdx])+'" alt="'+esc(curProduct.name)+'">'; if(imgs.length>1){ thumbs.innerHTML=imgs.map(function(img,i){ return '<div class="thumb'+(i===curImgIdx?' active':'')+'" onclick="setImg('+i+')"><img src="'+esc(img)+'" alt=""></div>'; }).join(''); }else{ thumbs.innerHTML=''; } } function changeImg(dir){ if(!curProduct.images||curProduct.images.length===0)return; var len=curProduct.images.length; curImgIdx=(curImgIdx+dir+len)%len; renderGallery(); } function setImg(idx){curImgIdx=idx;renderGallery()} function closePModal(){ document.getElementById('pModal').classList.remove('active'); document.body.style.overflow=''; }function openCS(){ var s=Store.getSettings(); var qr=document.getElementById('csQR'); if(s.customer_service_qr){ qr.innerHTML='<img src="'+esc(s.customer_service_qr)+'" alt="客服二维码">'; }else{ qr.innerHTML='<div class="ph">请前往后台<br>配置客服二维码</div>'; } document.getElementById('csWx').textContent=s.contact_wechat||'未配置'; document.getElementById('csModal').classList.add('active'); } function closeCS(){document.getElementById('csModal').classList.remove('active')} function copyWx(){ var t=document.getElementById('csWx').textContent; if(navigator.clipboard){ navigator.clipboard.writeText(t).then(function(){alert('已复制微信号：'+t)}).catch(function(){fallbackCopy(t)}); }else{fallbackCopy(t)} } function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t;ta.style.position='fixed';ta.style.opacity='0'; document.body.appendChild(ta);ta.select(); try{document.execCommand('copy');alert('已复制微信号：'+t)}catch(e){alert('请手动复制：'+t)} document.body.removeChild(ta); }document.querySelectorAll('.cat-nav button').forEach(function(btn){ btn.addEventListener('click',function(){ document.querySelectorAll('.cat-nav button').forEach(function(b){b.classList.remove('active')}); btn.classList.add('active'); var newCat=btn.dataset.cat; curCat=newCat; renderSections(); if(curCat!=='all'){ var sec=document.querySelector('.cat-section[data-cat="'+curCat+'"]'); if(sec)sec.scrollIntoView({behavior:'smooth',block:'start'}); } }); }); document.getElementById('pModal').addEventListener('click',function(e){if(e.target.id==='pModal')closePModal()}); document.getElementById('csModal').addEventListener('click',function(e){if(e.target.id==='csModal')closeCS()}); document.addEventListener('keydown',function(e){if(e.key==='Escape'){closePModal();closeCS()}});function highlightName(name,q){ var idx=name.toLowerCase().indexOf(q.toLowerCase()); if(idx===-1)return esc(name); var before=esc(name.slice(0,idx)); var match=esc(name.slice(idx,idx+q.length)); var after=esc(name.slice(idx+q.length)); return before+'<mark>'+match+'</mark>'+after; } var searchInput=document.getElementById('searchInput'); var searchClear=document.getElementById('searchClear'); var curSearch=''; searchInput.addEventListener('input',function(){ curSearch=this.value.trim(); if(curSearch){searchClear.classList.add('show');}else{searchClear.classList.remove('show');} renderSections(); }); searchClear.addEventListener('click',function(){ searchInput.value=''; curSearch=''; searchClear.classList.remove('show'); renderSections(); searchInput.focus(); }); searchInput.addEventListener('keydown',function(e){if(e.key==='Escape'){searchClear.click();}}); Store.init(); renderSections();</script>
