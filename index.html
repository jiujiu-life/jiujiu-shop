<style>
:root{
  --bg-main:#1A0A0F;
  --bg-card:rgba(42,18,24,0.88);
  --bg-warm:rgba(61,26,37,0.6);
  --bg-soft:rgba(42,18,24,0.5);
  --brand:#C44962;
  --accent:#8B1D3D;
  --pink:#D4A5A5;
  --pink-deep:#B08584;
  --rose:#E8C4C4;
  --pink-light:rgba(196,73,98,0.15);
  --text:#F5E0E0;
  --text-light:#C4A0A0;
  --border:rgba(196,73,98,0.2);
  --shadow-sm:0 2px 12px rgba(0,0,0,.3);
  --shadow-md:0 4px 24px rgba(0,0,0,.4);
  --shadow-lg:0 12px 48px rgba(0,0,0,.5);
  --r-sm:8px;--r-md:16px;--r-lg:24px;--trs:all .3s ease;
  --dark-red:#8B1D3D;--maroon:#6B0F2A;--crimson:#C44962;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);line-height:1.6;overflow-x:hidden;
  background:linear-gradient(180deg,#1A0A0F 0%,#240E16 30%,#1A0A0F 70%,#240E16 100%);
  background-attachment:fixed;
}

/* ===== Background Decorations ===== */
.bg-deco{position:fixed;pointer-events:none;z-index:0;opacity:.08}
.bg-deco.d1{top:0;left:0;width:100%;height:60vh;background:url('images/deco-dark1-20260830142400.png') no-repeat center top;background-size:cover}
.bg-deco.d2{bottom:0;right:0;width:100%;height:50vh;background:url('images/deco-dark2-20260830142401.png') no-repeat center bottom;background-size:cover;opacity:.06}

/* ===== Header ===== */
.header{position:sticky;top:0;z-index:100;background:rgba(26,10,15,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);box-shadow:0 1px 12px rgba(196,73,98,.1)}
.header-inner{max-width:1200px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand-block{display:flex;align-items:center;gap:14px}
.brand-logo{width:48px;height:48px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.brand-text{display:flex;flex-direction:column}
.brand-name{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:600;color:var(--brand);letter-spacing:2px;line-height:1.2}
.brand-tag{font-size:11px;color:var(--text-light);letter-spacing:2px;margin-top:2px}
.cat-nav{display:flex;gap:6px;flex-wrap:wrap}
.cat-nav button{padding:7px 18px;border:none;background:transparent;color:var(--text-light);font-size:14px;cursor:pointer;border-radius:20px;transition:var(--trs);font-family:inherit}
.cat-nav button:hover{color:var(--brand);background:rgba(196,73,98,.1)}
.cat-nav button.active{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff}

/* ===== Hero ===== */
.hero{text-align:center;padding:100px 24px 72px;position:relative;overflow:hidden;max-width:800px;margin:0 auto}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url('images/deco-dark2-20260830142401.png') no-repeat center center;background-size:cover;opacity:.12;pointer-events:none}
.hero::after{content:'';position:absolute;top:-50%;left:-10%;width:60%;height:200%;background:radial-gradient(ellipse,rgba(196,73,98,.1) 0%,transparent 70%);pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero h2{font-family:'Noto Serif SC',serif;font-size:42px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:16px;letter-spacing:1px}
.hero h2 .accent{color:var(--brand)}
.hero p{font-size:16px;color:var(--text-light);letter-spacing:3px;margin-bottom:8px}
.hero .sub-tag{display:inline-block;font-size:12px;color:var(--pink-deep);background:rgba(196,73,98,.1);padding:6px 20px;border-radius:20px;letter-spacing:2px;margin-top:12px;border:1px solid rgba(196,73,98,.2)}
.hero-deco{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--brand),transparent);margin:28px auto 0}

/* ===== Category Sections ===== */
.cat-section{max-width:1200px;margin:0 auto 60px;padding:0 28px;position:relative;z-index:1}
.cat-section-head{text-align:center;margin-bottom:32px;padding-top:40px}
.cat-section-head h3{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:500;color:var(--text);display:inline-block;position:relative}
.cat-section-head h3::after{content:'';display:block;width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--brand),transparent);margin:10px auto 0}
.cat-section-head p{font-size:13px;color:var(--text-light);margin-top:8px;letter-spacing:1px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.cat-grid-bg{background:url('images/deco-dark3-20260830142402.png') no-repeat center center;background-size:cover;padding:40px 32px;border-radius:var(--r-lg);border:1px solid var(--border);position:relative}
.cat-grid-bg::before{content:'';position:absolute;inset:0;background:rgba(26,10,15,.75);border-radius:var(--r-lg);pointer-events:none}
.cat-grid-bg .cat-grid{position:relative;z-index:1}

/* Load More Button */
.btn-more{display:block;margin:28px auto 0;padding:12px 40px;border:1px solid var(--border);background:rgba(196,73,98,.15);color:var(--brand);font-size:14px;cursor:pointer;border-radius:30px;transition:var(--trs);font-family:inherit;letter-spacing:1px;position:relative;z-index:1}
.btn-more:hover{background:rgba(196,73,98,.3);border-color:rgba(196,73,98,.4);transform:translateY(-2px)}
.btn-more.all-shown{background:transparent;color:var(--text-light);cursor:default;border-color:transparent}
.btn-more.all-shown:hover{background:transparent;transform:none}
.btn-more-wrap{text-align:center;margin-top:8px}

/* Product Card */
.p-card{background:var(--bg-card);border-radius:var(--r-md);overflow:hidden;cursor:pointer;transition:var(--trs);box-shadow:var(--shadow-sm);animation:fadeUp .5s ease forwards;opacity:0;border:1px solid var(--border)}
.p-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:rgba(196,73,98,.4)}
.p-card-img{width:100%;aspect-ratio:1;overflow:hidden;position:relative;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;padding:12px}
.p-card-img img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:transform .5s ease}
.p-card:hover .p-card-img img{transform:scale(1.06)}
.p-card-img .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:18px;color:rgba(255,255,255,.85);text-align:center;padding:20px;font-weight:500}
.p-card-info{padding:16px}
.p-card-cat{display:inline-block;font-size:11px;color:var(--brand);background:rgba(196,73,98,.12);padding:2px 10px;border-radius:10px;margin-bottom:8px;border:1px solid rgba(196,73,98,.2)}
.p-card-name{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;color:var(--text);margin-bottom:6px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-card-price{font-size:18px;color:var(--crimson);font-weight:600}
.p-card-price::before{content:'\00a5';font-size:13px;margin-right:1px}

/* ===== Product Detail Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(10,4,6,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s ease}
.overlay.active{display:flex;opacity:1}
.modal{background:var(--bg-card);border-radius:var(--r-lg);max-width:900px;width:100%;max-height:92vh;overflow-y:auto;position:relative;transform:scale(.92);transition:transform .3s ease;border:1px solid var(--border)}
.overlay.active .modal{transform:scale(1)}
.modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border:none;background:var(--bg-warm);border-radius:50%;font-size:20px;cursor:pointer;color:var(--text-light);z-index:10;transition:var(--trs);display:flex;align-items:center;justify-content:center;line-height:1}
.modal-close:hover{background:rgba(196,73,98,.2);color:var(--brand)}
.modal-body{display:grid;grid-template-columns:1fr 1fr;gap:0}

/* Gallery */
.gallery{padding:28px}
.gallery-main{width:100%;aspect-ratio:1;border-radius:var(--r-md);overflow:hidden;background:var(--bg-soft);margin-bottom:12px;position:relative;display:flex;align-items:center;justify-content:center;padding:16px;border:1px solid var(--border)}
.gallery-main img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.gallery-main .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:26px;color:rgba(255,255,255,.85);font-weight:500}
.gallery-nav{position:absolute;top:50%;width:100%;display:flex;justify-content:space-between;transform:translateY(-50%);pointer-events:none}
.gallery-nav button{width:36px;height:36px;border:none;background:rgba(42,18,24,.85);border-radius:50%;font-size:18px;cursor:pointer;color:var(--brand);pointer-events:auto;transition:var(--trs);display:flex;align-items:center;justify-content:center;margin:0 8px;border:1px solid var(--border)}
.gallery-nav button:hover{background:rgba(196,73,98,.3);box-shadow:var(--shadow-sm)}
.gallery-nav .hidden{visibility:hidden}
.gallery-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.gallery-thumbs::-webkit-scrollbar{height:4px}
.gallery-thumbs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.thumb{width:60px;height:60px;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:var(--trs);background:var(--bg-soft);display:flex;align-items:center;justify-content:center;padding:4px}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb.active{border-color:var(--brand)}

/* Product Info */
.p-info{padding:32px 28px 28px;display:flex;flex-direction:column}
.p-info .cat-tag{display:inline-block;align-self:flex-start;font-size:12px;color:var(--brand);background:rgba(196,73,98,.12);padding:4px 12px;border-radius:12px;margin-bottom:12px;border:1px solid rgba(196,73,98,.2)}
.p-info h2{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:600;color:var(--text);margin-bottom:14px}
.p-info .price{font-size:30px;color:var(--crimson);font-weight:700;margin-bottom:22px}
.p-info .price::before{content:'\00a5';font-size:18px;margin-right:3px}
.p-info .desc{font-size:15px;color:var(--text);line-height:1.85;margin-bottom:24px;flex:1;position:relative;padding:16px 20px;background:var(--bg-warm);border-radius:var(--r-md);border-left:3px solid var(--rose)}
.p-info .desc::before{content:'\201C';font-family:'Noto Serif SC',serif;font-size:32px;color:var(--rose);position:absolute;top:4px;left:8px;line-height:1;opacity:.6}
.p-info .stock-info{font-size:13px;color:var(--text-light);margin-bottom:20px}
.p-info .stock-info .in-stock{color:#7BBE8E}
.btn-consult{width:100%;padding:15px;border:none;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;font-size:15px;font-weight:500;border-radius:var(--r-md);cursor:pointer;transition:var(--trs);font-family:inherit;letter-spacing:2px}
.btn-consult:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(196,73,98,.4)}

/* ===== Customer Service Modal ===== */
.cs-modal{max-width:360px;text-align:center;padding:40px 32px 32px;background:var(--bg-card)}
.cs-modal h3{font-family:'Noto Serif SC',serif;font-size:20px;color:var(--brand);margin-bottom:6px}
.cs-modal .sub{font-size:13px;color:var(--text-light);margin-bottom:24px}
.cs-qr{width:200px;height:200px;margin:0 auto 24px;border-radius:var(--r-md);overflow:hidden;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.cs-qr img{width:100%;height:100%;object-fit:cover}
.cs-qr .ph{color:var(--text-light);font-size:13px;text-align:center;padding:20px}
.cs-wechat{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.cs-wechat .lbl{font-size:14px;color:var(--text-light)}
.cs-wechat .wid{font-size:16px;color:var(--text);font-weight:500}
.btn-copy{padding:4px 12px;border:1px solid var(--border);background:var(--bg-card);color:var(--brand);font-size:12px;border-radius:12px;cursor:pointer;transition:var(--trs);font-family:inherit}
.btn-copy:hover{background:rgba(196,73,98,.15)}
.cs-hint{font-size:12px;color:var(--text-light);margin-top:12px;line-height:1.6}

/* ===== Footer ===== */
.footer{text-align:center;padding:36px 24px;border-top:1px solid var(--border);background:rgba(26,10,15,.9);position:relative}
.footer p{font-size:13px;color:var(--text-light);margin-bottom:6px}
.footer .tag{font-size:12px;color:var(--pink-deep);margin-bottom:8px}
.footer .admin-link{font-size:12px;color:var(--text-light);text-decoration:none;opacity:.5;transition:var(--trs)}
.footer .admin-link:hover{opacity:1;color:var(--brand)}

/* ===== Empty State ===== */
.empty{text-align:center;padding:80px 24px;color:var(--text-light)}
.empty .ic{font-size:48px;margin-bottom:16px;opacity:.3}
.empty p{font-size:15px}

/* ===== Animations ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== Responsive ===== */
@media(max-width:1024px){
  .cat-grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .cat-grid-bg{padding:32px 24px}
}
@media(max-width:768px){
  .header-inner{flex-direction:column;gap:10px;padding:12px 16px}
  .hero{padding:56px 20px 36px}
  .hero h2{font-size:28px}
  .modal-body{grid-template-columns:1fr}
  .gallery{padding:16px}
  .p-info{padding:16px 20px}
  .p-info h2{font-size:22px}
  .p-info .price{font-size:26px}
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .cat-grid-bg{padding:24px 16px}
  .p-card-info{padding:12px 10px}
  .p-card-name{font-size:15px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .p-card-price{font-size:16px}
}
@media(max-width:480px){
  .cat-grid{grid-template-columns:1fr}
  .hero h2{font-size:24px}
  .cat-nav button{padding:6px 14px;font-size:13px}
  .cs-modal{padding:32px 20px}
  .brand-logo{width:40px;height:40px}
  .cat-section{padding:0 16px}
}
</style>
</head>

}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ===== Render Category Sections ===== */
function renderSections(){
  var container=document.getElementById('catSections');
  var empty=document.getElementById('empty');
  var ps=Store.getProducts().filter(function(p){return p.status==='published'});
  
  if(curCat!=='all'){
    ps=ps.filter(function(p){return p.category===curCat});
    if(ps.length===0){container.innerHTML='';empty.style.display='block';return}
    empty.style.display='none';
    container.innerHTML=buildSectionHTML(curCat,ps,0);
    return;
  }
  
  empty.style.display='none';
  var html='';
  var delayOffset=0;
  CAT_ORDER.forEach(function(cat){
    var catPs=ps.filter(function(p){return p.category===cat});
    if(catPs.length>0){
      html+=buildSectionHTML(cat,catPs,delayOffset);
      delayOffset+=4;
    }
  });
  container.innerHTML=html;
}

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function buildCard(p,startDelay){
  var hasImg=p.images&&p.images.length>0;
  var imgHTML=hasImg?'<img src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'" loading="lazy">'
    :'<div class="ph" style="background:'+grad(p.category)+'">'+esc(p.name)+'</div>';
  return '<div class="p-card" style="animation-delay:'+(startDelay*0.08)+'s" onclick="openP(\''+p.id+'\')">'
    +'<div class="p-card-img">'+imgHTML+'</div>'
    +'<div class="p-card-info">'
    +'<span class="p-card-cat">'+esc(p.category)+'</span>'
    +'<div class="p-card-name">'+esc(p.name)+'</div>'
    +'<div class="p-card-price">'+esc(p.price)+'</div></div></div>';
}

function buildSectionHTML(cat,products,startDelay){
  var shuffled=shuffle(products);
  var showCount=Math.min(8,shuffled.length);
  var shown=shuffled.slice(0,showCount);
  var remaining=shuffled.slice(showCount);
  var cards=shown.map(function(p,i){return buildCard(p,startDelay+i)}).join('');
  var moreHTML='';
  if(remaining.length>0){
    moreHTML='<div class="btn-more-wrap" id="more-'+esc(cat)+'" data-remaining="'+esc(JSON.stringify(remaining))+'"><button class="btn-more" onclick="showMore(\''+esc(cat)+'\')">查看更多（还剩 '+remaining.length+' 件）</button></div>';
  }else if(products.length>8){
    moreHTML='<div class="btn-more-wrap"><button class="btn-more all-shown" disabled>已展示全部 '+products.length+' 件商品</button></div>';
  }
  return '<section class="cat-section" data-cat="'+esc(cat)+'">'
    +'<div class="cat-section-head"><h3>'+esc(cat)+'</h3><p>'+esc(CAT_DESC[cat]||'')+'</p></div>'
    +'<div class="cat-grid-bg"><div class="cat-grid" id="grid-'+esc(cat)+'">'+cards+'</div>'+moreHTML+'</div>'
    +'</section>';
}

function showMore(cat){
  var wrap=document.getElementById('more-'+cat);
  if(!wrap)return;
  var data=wrap.getAttribute('data-remaining');
  var remaining=JSON.parse(data);
  var grid=document.getElementById('grid-'+cat);
  var existing=grid.querySelectorAll('.p-card').length;
  var next=remaining.splice(0,8);
  wrap.setAttribute('data-remaining',JSON.stringify(remaining));
  next.forEach(function(p,i){
    var div=document.createElement('div');
    div.innerHTML=buildCard(p,existing+i);
    grid.appendChild(div.firstElementChild);
  });
  if(remaining.length>0){
    wrap.querySelector('button').textContent='查看更多（还剩 '+remaining.length+' 件）';
  }else{
    wrap.innerHTML='<button class="btn-more all-shown" disabled>已展示全部</button>';
  }
}

function copyWx(){
  var t=document.getElementById('csWx').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(function(){alert('已复制微信号：'+t)}).catch(function(){fallbackCopy(t)});
  }else{fallbackCopy(t)}
}
function fallbackCopy(t){
  var ta=document.createElement('textarea');
  ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('已复制微信号：'+t)}catch(e){alert('请手动复制：'+t)}
  document.body.removeChild(ta);
}
